<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mash-Ups - 25K Metaphor Items</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f4ee;
            color: #1f1b16;
            padding: 10px 20px 20px 20px;
        }

        body.has-global-nav > .container,
        body.has-global-nav > div:not(.global-nav) {
            margin-top: 8px !important;
        }

        @media (max-width: 768px) {
            body.has-global-nav > .container,
            body.has-global-nav > div:not(.global-nav) {
                margin-top: 0 !important;
            }
        }
        .drawer-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .drawer-backdrop.show {
            display: block;
            opacity: 1;
        }
        .gens-drawer {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 460px;
            max-width: 92vw;
            height: 100vh;
            background: #fdfbf7;
            border-left: 2px solid #d4cec4;
            box-shadow: -4px 0 12px rgba(0,0,0,0.15);
            z-index: 1000;
            overflow: hidden;
            padding: 0;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        .gens-drawer.show {
            display: block;
            transform: translateX(0);
        }
        .gens-drawer-close {
            display: none !important;
        }

        .gens-drawer-inner {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 72px 20px 84px 20px;
        }

        @media (max-width: 768px) {
            .gens-drawer {
                width: 75vw;
                max-width: 75vw;
            }
            .gens-drawer-inner {
                padding: 72px 16px calc(140px + env(safe-area-inset-bottom, 0px)) 16px;
            }
        }

        #unifiedDrawerControls {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10150;
            pointer-events: none;
            display: none;
        }

        #unifiedDrawerControls .drawer-close-btn,
        #unifiedDrawerControls .drawer-scroll-btn-top,
        #unifiedDrawerControls .drawer-scroll-btn-bottom {
            pointer-events: auto;
        }

        .drawer-close-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            background: rgba(44, 37, 32, 0.9);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
            z-index: 10160;
        }

        .drawer-scroll-btn-top,
        .drawer-scroll-btn-bottom {
            position: fixed;
            right: var(--scroll-btn-right, 14px);
            background: rgba(44, 37, 32, 0.7);
            color: white;
            border: none;
            width: var(--scroll-btn-size, 44px);
            height: var(--scroll-btn-size, 44px);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
            z-index: 10155;
            transform: translateY(-50%);

        .drawer-scroll-btn-top {
            top: calc(50% + var(--scroll-btn-center-shift, 0px) - (var(--scroll-btn-gap, 18px) / 2) - (var(--scroll-btn-size, 44px) / 2));
        }
        .drawer-scroll-btn-bottom {
            top: calc(50% + var(--scroll-btn-center-shift, 0px) + (var(--scroll-btn-gap, 18px) / 2) + (var(--scroll-btn-size, 44px) / 2));

        }
        .gens-drawer-header {

            gap: 12px;

<body>
    <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeGensDrawer()"></div>
    <div id="gensDrawer" class="gens-drawer"></div>
    <div class="container">
        <div class="search-box">
            <div class="topbar">
                <div class="topbar-left">
                    <div class="tabs">
                        <button class="tab" data-tab="browse" onclick="switchTab('browse')">Category</button>
                        <button class="tab active" data-tab="cluster" onclick="switchTab('cluster')">Motif</button>
                    </div>
                    <div id="browseControls" class="browse-controls" style="display:none;">
                        <select id="browseExerciseSelect" onchange="browseFromDropdown()">
                            <option value="__all__">All Categories</option>
                        </select>
                        <button class="copy-btn" type="button" onclick="shuffleCurrentView()" style="font-style: normal;">Shuffle</button>
                    </div>
                    <div id="clusterControls" class="cluster-controls">
                        <select id="clusterSort" onchange="filterClusters()">
                            <option value="count_desc">Most Items</option>
                            <option value="count_asc">Fewest Items</option>
                            <option value="alpha_asc">A-Z</option>
                            <option value="alpha_desc">Z-A</option>
                        </select>
                        <button class="copy-btn" type="button" onclick="shuffleMotifs()" style="font-style: normal;">Shuffle</button>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="cluster-pagination" id="clusterPagination"></div>
                </div>
            </div>

            <div id="browseTab" class="tab-content"></div>

            <div id="clusterTab" class="tab-content active">
                <div id="clusterList"></div>
            </div>
        </div>

        <div class="results" id="results">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script src="/shared-cache.js"></script>
    <script>
        let webData = null;
        let clusterIndex = [];
        let exerciseNameMap = {};
        
        const EXERCISE_CATEGORIES = {
            'Objects': ['Object Characteristics', 'Categorized Object Characteristics'],
            'Sensory': ['Sensory Details', 'Sensory Characteristics'],
            'Emotional': ['Emotional Landscapes', 'Emotional States'],
            'Titles': ['Titles'],
            'Temporal / Spatial': ['Temporal Characteristics', 'Spatial Relationships'],
            'Action': ['Action Sequences', 'Movement Patterns'],
            'Metaphorical / Cultural': ['Cultural Bridges', 'Metaphorical Connections', 'Abstract Concepts']
        };
        let currentResults = [];
        let currentContext = null; // { type, query, exerciseId, ending, clusterName, allItems }
        let pagination = { offset: 0, limit: 50 };
        let currentTitle = '';
        let currentSearchTerm = '';
        let currentTotal = 0;
        let allItemsFlat = [];
        const clusterItemsMap = {};
        const MOTIF_LIST_PAGE_SIZE = 60;
        const CLUSTER_HASH = '#cluster';
        let pendingClusterActivation = window.location.hash === CLUSTER_HASH;
        const motifListState = { page: 0, order: null, sort: 'count_desc' };

        // Load data on page load
        async function loadData() {
            console.log('[DEBUG] loadData() called, MetaphorGymCache:', window.MetaphorGymCache);
            try {
                if (!window.MetaphorGymCache) {
                    console.error('[ERROR] MetaphorGymCache is undefined!');
                    throw new Error('MetaphorGymCache not loaded');
                }
                // Load web display data using cache
                console.log('[DEBUG] Calling getCreativeGensData...');
                console.log('[DEBUG] getCreativeGensData type:', typeof window.MetaphorGymCache.getCreativeGensData);
                const promise = window.MetaphorGymCache.getCreativeGensData();
                console.log('[DEBUG] Promise returned:', promise);
                webData = await promise;
                console.log('[DEBUG] webData loaded:', webData ? 'success' : 'null');

                // Load cluster index using cache
                clusterIndex = await window.MetaphorGymCache.getCreativeGensClusters();
                clusterIndex = Array.isArray(clusterIndex) ? clusterIndex : (clusterIndex?.clusters || []);

                // Populate exercise dropdowns
                const browseSelect = document.getElementById('browseExerciseSelect');

                // Build category map
                const categoryMap = {};
                Object.entries(EXERCISE_CATEGORIES).forEach(([category, exercises]) => {
                    exercises.forEach(ex => {
                        const section = webData.sections.find(s => s.name === ex);
                        if (section) {
                            if (!categoryMap[category]) categoryMap[category] = [];
                            categoryMap[category].push(section);
                        }
                    });
                });

                webData.sections.forEach(section => {
                    exerciseNameMap[section.id] = section.name;
                });

                // Populate browse dropdown with categories
                Object.entries(categoryMap).forEach(([category, sections]) => {
                    const totalCount = sections.reduce((sum, s) => sum + s.count, 0);
                    const option = document.createElement('option');
                    option.value = JSON.stringify(sections.map(s => s.id));
                    option.textContent = `${category} (${totalCount} items)`;
                    browseSelect.appendChild(option);
                });

                // Build flat list for cluster lookup
                allItemsFlat = [];

                webData.sections.forEach(section => {
                    section.items.forEach(item => {
                        const metadata = item.metadata || {};
                        const enrichedItem = {
                            ...item,
                            metadata,
                            exercise_id: section.id,
                            exercise_name: section.name,
                        };
                        allItemsFlat.push(enrichedItem);
                        const clusterName = metadata.claude_cluster || metadata.claude_classification?.cluster_name;
                        registerClusterItem(clusterName, enrichedItem);
                    });
                });

                renderClusterList();
                handleClusterHashNavigation();
                showLandingState();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('results').innerHTML = '<div class="loading">Error loading data. Please refresh the page.</div>';
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(button => {
                button.classList.toggle('active', button.dataset.tab === tab);
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === `${tab}Tab`);
            });

            const browseControls = document.getElementById('browseControls');
            const clusterControls = document.getElementById('clusterControls');
            const clusterPagination = document.getElementById('clusterPagination');
            if (browseControls) browseControls.style.display = (tab === 'browse') ? 'flex' : 'none';
            if (clusterControls) clusterControls.style.display = (tab === 'cluster') ? 'flex' : 'none';
            if (clusterPagination) clusterPagination.style.display = (tab === 'cluster') ? 'flex' : 'none';

            currentContext = null;
            currentResults = [];
            currentSearchTerm = '';
            currentTotal = 0;
            pagination.offset = 0;
            showLandingState();
            if (tab === 'cluster') {
                if (window.location.hash !== CLUSTER_HASH) {
                    pendingClusterActivation = false;
                    window.location.hash = CLUSTER_HASH;
                }
            } else if (window.location.hash === CLUSTER_HASH) {
                history.replaceState(null, '', window.location.pathname);
            }

            if (tab === 'browse') {
                const select = document.getElementById('browseExerciseSelect');
                if (select && select.value) {
                    browseFromDropdown();
                }
            }
        }

        function showLandingState() {
            const container = document.getElementById('results');
            if (!container) return;
            container.innerHTML = '';
        }

        function browseFromDropdown() {
            const select = document.getElementById('browseExerciseSelect');
            const value = select.value;
            if (!value) return;

            const isAll = value === '__all__';
            const exerciseIds = isAll ? [] : JSON.parse(value);
            const category = select.options[select.selectedIndex].text.split(' (')[0];

            const allItems = [];
            if (isAll) {
                (webData.sections || []).forEach(section => {
                    (section.items || []).forEach(item => {
                        allItems.push({
                            ...item,
                            exercise_id: section.id,
                            exercise_name: section.name
                        });
                    });
                });
            } else {
                exerciseIds.forEach(id => {
                    const section = webData.sections.find(s => s.id === id);
                    if (section) {
                        section.items.forEach(item => {
                            allItems.push({
                                ...item,
                                exercise_id: section.id,
                                exercise_name: section.name
                            });
                        });
                    }
                });
            }

            showLoading();
            currentContext = { type: 'category', category, exerciseIds, allItems };
            pagination.offset = Math.min(pagination.limit, allItems.length);
            setResults(allItems.slice(0, pagination.limit), `Category: ${category}`, '', allItems.length);
        }
        
        async function browseExercise(exerciseId, exerciseName, count) {
            showLoading();
            
            const section = webData.sections.find(s => s.id === exerciseId);
            if (!section) return;
            const mapped = section.items.map(item => ({
                ...item,
                exercise_id: section.id,
                exercise_name: exerciseName
            }));
            currentContext = {
                type: 'browse',
                exerciseId,
                exerciseName,
                allItems: mapped
            };
            pagination.offset = Math.min(pagination.limit, mapped.length);
            setResults(mapped.slice(0, pagination.limit), exerciseName, '', mapped.length);
        }

        function dedupeById(items) {
            const seen = new Set();
            const deduped = [];
            items.forEach(item => {
                if (!seen.has(item.id)) {
                    seen.add(item.id);
                    deduped.push(item);
                }
            });
            return deduped;
        }

        function formatTitle(polished, metadata = {}) {
            const titleTypes = [metadata.title_type, metadata.pattern_type, metadata.semantic_type]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            const needsTitleStyle = titleTypes.includes('semantic boosted') || titleTypes.includes('hit pattern');
            const text = polished || '';
            return needsTitleStyle ? `<span class="title-text">“${capitalize(text)}”</span>` : text;
        }

        function capitalize(text) {
            if (!text) return text;
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function highlightSearchTerm(text, searchTerm) {
            if (!searchTerm || !text) return text;
            
            const baseWord = searchTerm.toLowerCase().replace(/[^a-z]/g, '');
            const regex = new RegExp(`(${baseWord}\\w*)`, 'gi');
            
            return text.replace(regex, '<strong><em>$1</em></strong>');
        }

        function setResults(items, title, searchTerm = '', totalCount = null) {
            currentResults = [...items];
            currentTitle = title;
            currentSearchTerm = searchTerm;
            currentTotal = totalCount || currentResults.length;
            renderResults(hasMore());
        }

        function shuffleArray(arr) {
            const copy = (Array.isArray(arr) ? arr.slice() : []);
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = copy[i];
                copy[i] = copy[j];
                copy[j] = temp;
            }
            return copy;
        }

        function shuffleCurrentView() {
            if (!currentContext || !Array.isArray(currentContext.allItems)) return;
            currentContext.allItems = shuffleArray(currentContext.allItems);
            pagination.offset = Math.min(pagination.limit, currentContext.allItems.length);
            setResults(currentContext.allItems.slice(0, pagination.limit), currentTitle, currentSearchTerm, currentContext.allItems.length);
        }

        function appendResults(items) {
            const seen = new Set(currentResults.map(item => item.id));
            items.forEach(item => {
                if (!seen.has(item.id)) {
                    seen.add(item.id);
                    currentResults.push(item);
                }
            });
            renderResults(hasMore());
        }

        function hasMore() {
            return currentContext && currentContext.allItems && pagination.offset < currentContext.allItems.length;
        }

        function renderResults(canLoadMore = false) {
            const container = document.getElementById('results');
            if (!currentResults.length) {
                container.innerHTML = '<div class="loading">No results found</div>';
                return;
            }
            const countLabel = currentTotal ? `${currentResults.length} of ${currentTotal}` : currentResults.length;
            let html = `<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 16px;">
                <h2 style="margin: 0;">${currentTitle} (${countLabel} results)</h2>
                <button class="copy-btn" onclick="shuffleCurrentView()" style="font-style: normal;">Shuffle</button>
            </div>`;
            currentResults.forEach(item => {
                const polished = highlightSearchTerm(formatTitle(item.polished || item.text || '', item.metadata || {}), currentSearchTerm);
                const raw = item.raw || '';
                const copyPayload = encodeURIComponent(item.polished || item.text || '');
                const classificationChips = getClassificationChips(item.metadata || {});
                html += `
                    <div class="result-item">
                        <div class="result-meta">
                            <span class="result-exercise" style="font-size: 0.82rem; opacity: 0.75;">Click to copy • Double-click to add to Notes</span>
                        </div>
                        <button type="button" class="phrase-pill" data-clickable data-text="${copyPayload}">${polished}</button>
                        ${classificationChips}
                        ${raw ? `<div class="result-raw">Raw: ${raw}</div>` : ''}
                    </div>
                `;
            });
            if (canLoadMore) {
                html += `<button class="load-more-btn" onclick="loadMore()">Load 50 more</button>`;
            }
            container.innerHTML = html;
            if (window.SharedInteractions && typeof window.SharedInteractions.autoApplyClickable === 'function') {
                window.SharedInteractions.autoApplyClickable();
            }
        }

        function copyFromButton(event) {
            event.preventDefault();
            event.stopPropagation();
            const text = decodeURIComponent(event.currentTarget.dataset.text || '');
            if (window.SharedInteractions && typeof window.SharedInteractions.copyToClipboard === 'function') {
                window.SharedInteractions.copyToClipboard(text);
            } else {
                navigator.clipboard.writeText(text);
            }
        }

        function getExerciseLabel(item) {
            const id = item.exercise_id || item.exercise;
            return exerciseNameMap[id] || 'Mash-Ups';
        }

        function loadMore() {
            if (!currentContext || !currentContext.allItems) return;
            const nextItems = currentContext.allItems.slice(pagination.offset, pagination.offset + pagination.limit);
            pagination.offset += nextItems.length;
            appendResults(nextItems);
        }

        function showLoading() {
            document.getElementById('results').innerHTML = '<div class="loading">Loading...</div>';
        }

        function getClassificationChips(metadata = {}) {
            const claude = metadata.claude_classification;
            if (!claude) return '';
            const chips = [];
            if (claude.primary_emotion) {
                chips.push(`<span class="chip chip-emotion">${escapeHtml(claude.primary_emotion)}</span>`);
            }
            if (claude.action_or_gesture) {
                chips.push(`<span class="chip chip-action">${escapeHtml(claude.action_or_gesture)}</span>`);
            }
            if (claude.aesthetic_or_material) {
                chips.push(`<span class="chip chip-aesthetic">${escapeHtml(claude.aesthetic_or_material)}</span>`);
            }
            return chips.length ? `<div class="classification-chips">${chips.join('')}</div>` : '';
        }

        function getClusterBadge(metadata = {}) {
            const motif = metadata.claude_cluster || metadata.claude_classification?.cluster_name;
            if (!motif) return '';
            const encoded = encodeURIComponent(motif);
            return `<button class="motif-badge" data-cluster="${encoded}" onclick="viewClusterFromBadge(event)">Motif: ${escapeHtml(motif)}</button>`;
        }

        function viewClusterFromBadge(event) {
            event.preventDefault();
            event.stopPropagation();
            const datasetValue = event.currentTarget.dataset.cluster;
            if (!datasetValue) return;
            viewCluster(decodeURIComponent(datasetValue));
        }

        function closeGensDrawer() {
            const drawer = document.getElementById('gensDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            const controls = document.getElementById('unifiedDrawerControls');
            if (drawer) {
                drawer.classList.remove('show');
                drawer.innerHTML = '';
            }
            if (backdrop) {
                backdrop.classList.remove('show');
            }
            if (controls) {
                controls.innerHTML = '';
                controls.style.display = 'none';
                controls.remove();
            }
        }

        function getDrawerScroller() {
            const drawer = document.getElementById('gensDrawer');
            if (!drawer) return null;
            return drawer.querySelector('.gens-drawer-inner') || drawer;
        }

        function scrollDrawerToTop() {
            const scroller = getDrawerScroller();
            if (!scroller) return;
            scroller.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollDrawerToBottom() {
            const scroller = getDrawerScroller();
            if (!scroller) return;
            scroller.scrollTo({ top: scroller.scrollHeight, behavior: 'smooth' });
        }

        function updateDrawerScrollButtons() {
            const drawer = document.getElementById('gensDrawer');
            const scroller = getDrawerScroller();
            if (!drawer || !scroller) return;
            const controls = document.getElementById('unifiedDrawerControls');
            if (!controls) return;

            if (!drawer.classList.contains('show')) {
                controls.innerHTML = '';
                controls.style.display = 'none';
                return;
            }

            const topBtn = controls.querySelector('.drawer-scroll-btn-top');
            const bottomBtn = controls.querySelector('.drawer-scroll-btn-bottom');
            if (!topBtn || !bottomBtn) return;

            const scrollTop = scroller.scrollTop;
            const scrollBottom = scroller.scrollHeight - scrollTop - scroller.clientHeight;
            topBtn.style.display = scrollTop < 10 ? 'none' : 'flex';
            bottomBtn.style.display = scrollBottom < 10 ? 'none' : 'flex';
        }

        function attachDrawerScrollHandlers() {
            const scroller = getDrawerScroller();
            if (!scroller) return;
            scroller.removeEventListener('scroll', updateDrawerScrollButtons);
            scroller.addEventListener('scroll', updateDrawerScrollButtons, { passive: true });
            updateDrawerScrollButtons();
        }

        function ensureDrawerControls() {
            let controls = document.getElementById('unifiedDrawerControls');
            if (!controls) {
                controls = document.createElement('div');
                controls.id = 'unifiedDrawerControls';
                controls.style.display = 'none';
                document.body.appendChild(controls);
            }
            return controls;
        }

        function showDrawerControls() {
            const drawer = document.getElementById('gensDrawer');
            if (!drawer || !drawer.classList.contains('show')) return;
            const controls = ensureDrawerControls();
            controls.innerHTML = '';
            controls.style.display = 'block';

            const closeBtn = document.createElement('button');
            closeBtn.className = 'drawer-close-btn';
            closeBtn.title = 'Close';
            closeBtn.textContent = '×';
            closeBtn.onclick = closeGensDrawer;

            const topBtn = document.createElement('button');
            topBtn.className = 'drawer-scroll-btn-top';
            topBtn.title = 'Scroll to top';
            topBtn.textContent = '↑';
            topBtn.onclick = function(e) { e.stopPropagation(); scrollDrawerToTop(); };

            const bottomBtn = document.createElement('button');
            bottomBtn.className = 'drawer-scroll-btn-bottom';
            bottomBtn.title = 'Scroll to bottom';
            bottomBtn.textContent = '↓';
            bottomBtn.onclick = function(e) { e.stopPropagation(); scrollDrawerToBottom(); };

            controls.appendChild(closeBtn);
            controls.appendChild(topBtn);
            controls.appendChild(bottomBtn);

            updateDrawerScrollButtons();
        }

        function openGensDrawerById(encodedId) {
            const drawer = document.getElementById('gensDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            if (!drawer || !backdrop) return;

            const idStr = decodeURIComponent(encodedId || '');
            if (!idStr) return;
            const item = allItemsFlat.find(function(it) {
                return String(it.id || '') === idStr;
            }) || currentResults.find(function(it) {
                return String(it.id || '') === idStr;
            });
            if (!item) return;

            const exerciseLabel = getExerciseLabel(item);
            const motif = (item.metadata && (item.metadata.claude_cluster || item.metadata.claude_classification?.cluster_name)) || '';
            const polishedText = (item.polished || item.text || '').toString();
            const rawText = (item.raw || '').toString();
            const notesText = (item.polish_notes || '').toString();

            backdrop.classList.add('show');
            drawer.classList.add('show');

            const allText = [
                polishedText && `Polished: ${polishedText}`,
                rawText && `Raw: ${rawText}`,
                notesText && `Notes: ${notesText}`
            ].filter(Boolean).join('\n');

            drawer.innerHTML =
                '<div class="gens-drawer-inner">'
                + '<div style="font-weight: 700; color: #1f1b16; font-size: 1.1rem;">' + escapeHtml(exerciseLabel) + '</div>'
                + (motif ? ('<div style="margin-top: 4px; margin-bottom: 14px; font-weight: 500; color: #6f675c; font-size: 0.9rem;">Motif: ' + escapeHtml(motif) + '</div>') : '<div style="margin-bottom: 14px;"></div>')
                + '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px">'
                + '<button class="copy-btn" data-text="' + encodeURIComponent(polishedText) + '" onclick="copyFromButton(event)">Copy Polished</button>'
                + (rawText ? '<button class="copy-btn" data-text="' + encodeURIComponent(rawText) + '" onclick="copyFromButton(event)">Copy Raw</button>' : '')
                + (notesText ? '<button class="copy-btn" data-text="' + encodeURIComponent(notesText) + '" onclick="copyFromButton(event)">Copy Notes</button>' : '')
                + '<button class="copy-btn" data-text="' + encodeURIComponent(allText) + '" onclick="copyFromButton(event)">Copy All</button>'
                + '</div>'
                + buildDrawerLine('Polished', polishedText)
                + buildDrawerLine('Raw', rawText)
                + buildDrawerLine('Notes', notesText)
                + '</div>';

            showDrawerControls();
            setTimeout(function() {
                attachDrawerScrollHandlers();
            }, 60);
        }

        function buildDrawerLine(label, text) {
            const raw = (text || '').toString();
            if (!raw) return '';
            const encoded = encodeURIComponent(raw);
            return '<div class="drawer-line" onclick="copyDrawerLineEncoded(this, \'' + encoded + '\')">'
                + '<span class="drawer-line-label">' + escapeHtml(label) + '</span>'
                + '<div>' + escapeHtml(raw) + '</div>'
                + '</div>';
        }

        function copyDrawerLineEncoded(element, encodedText) {
            const value = decodeURIComponent(encodedText || '');
            if (!value) return;
            navigator.clipboard.writeText(value).then(function() {
                if (!element) return;
                element.classList.add('copied');
                setTimeout(function() {
                    element.classList.remove('copied');
                }, 900);
            }).catch(function() {
            });
        }

        function viewCluster(clusterName) {
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (!clusterName) return;
            const items = getClusterItems(clusterName);
            if (!items.length) {
                alert('No items mapped to this cluster yet.');
                return;
            }
            showLoading();
            currentContext = {
                type: 'cluster',
                clusterName,
                allItems: items
            };
            pagination.offset = Math.min(pagination.limit, items.length);
            setResults(items.slice(0, pagination.limit), `Motif: ${clusterName}`, '', items.length);
        }

        function registerClusterItem(clusterName, item) {
            if (!clusterName) return;
            const key = clusterName.toLowerCase();
            if (!clusterItemsMap[key]) {
                clusterItemsMap[key] = [];
            }
            clusterItemsMap[key].push(item);
        }

        function getClusterItems(clusterName) {
            if (!clusterName) return [];
            return clusterItemsMap[clusterName.toLowerCase()] || [];
        }

        function filterClusters() {
            motifListState.page = 0;
            motifListState.order = null;
            renderClusterList();
        }

        function shuffleMotifs() {
            const list = getMotifListSorted();
            motifListState.order = shuffleArray(list);
            motifListState.page = 0;
            renderClusterList();
        }

        function getMotifListSorted() {
            const sortValue = document.getElementById('clusterSort')?.value || 'count_desc';
            motifListState.sort = sortValue;
            let list = Array.isArray(clusterIndex) ? clusterIndex.slice() : [];
            list = list.filter(c => (c?.count || 0) > 1);
            list.sort((a, b) => {
                const countA = a.count || 0;
                const countB = b.count || 0;
                switch (sortValue) {
                    case 'count_asc':
                        return countA - countB;
                    case 'alpha_asc':
                        return (a.name || '').localeCompare(b.name || '');
                    case 'alpha_desc':
                        return (b.name || '').localeCompare(a.name || '');
                    case 'count_desc':
                    default:
                        return countB - countA;
                }
            });
            return list;
        }

        function setMotifListPage(nextPage) {
            const list = motifListState.order || getMotifListSorted();
            const totalPages = Math.max(1, Math.ceil(list.length / MOTIF_LIST_PAGE_SIZE));
            motifListState.page = Math.min(Math.max(0, nextPage), totalPages - 1);
            renderClusterList();
        }

        function renderClusterList() {
            const listEl = document.getElementById('clusterList');
            if (!listEl) return;
            if (!clusterIndex.length) {
                listEl.innerHTML = '<div class="loading">Motif index loading...</div>';
                return;
            }
            if (!motifListState.order) {
                motifListState.order = getMotifListSorted();
            }
            const list = motifListState.order || [];
            const total = list.length;
            const totalPages = Math.max(1, Math.ceil(total / MOTIF_LIST_PAGE_SIZE));
            const start = motifListState.page * MOTIF_LIST_PAGE_SIZE;
            const end = Math.min(start + MOTIF_LIST_PAGE_SIZE, total);
            const slice = list.slice(start, end);

            const pager = document.getElementById('clusterPagination');
            if (pager) {
                const isMobile = window.matchMedia && window.matchMedia('(max-width: 520px)').matches;
                const pageLabel = isMobile
                    ? `${(start + 1).toLocaleString()}–${end.toLocaleString()} / ${total.toLocaleString()}`
                    : `${(start + 1).toLocaleString()}–${end.toLocaleString()} of ${total.toLocaleString()} motifs`;
                pager.innerHTML = `
                    <div style="color:#6f675c; font-size: 0.9rem;">${pageLabel}</div>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button class="copy-btn" type="button" onclick="setMotifListPage(${motifListState.page - 1})" ${motifListState.page <= 0 ? 'disabled' : ''}>Prev</button>
                        <div style="color:#6f675c; font-size: 0.9rem;">Page ${(motifListState.page + 1)} / ${totalPages}</div>
                        <button class="copy-btn" type="button" onclick="setMotifListPage(${motifListState.page + 1})" ${motifListState.page >= totalPages - 1 ? 'disabled' : ''}>Next</button>
                    </div>
                `;
            }

            if (!slice.length) {
                listEl.innerHTML = '<p style="color:#666;">No motifs available.</p>';
                return;
            }
            const html = slice.map(renderMotifDrillRow).join('');
            listEl.innerHTML = `<div class="motif-drill">${html}</div>`;
        }

        const MOTIF_PANEL_PAGE_SIZE = 10;
        const motifPanelState = {}; // { [lowerKey]: { limit: number } }

        function renderMotifDrillRow(cluster) {
            const count = cluster.count || 0;
            if (count <= 1) return '';
            const encodedCluster = encodeURIComponent(cluster.name || '');
            const countLabel = count.toLocaleString();
            return `
                <div class="motif-row" data-cluster="${encodedCluster}" onclick="toggleMotifPanel(event)">
                    <div class="motif-row-name">${escapeHtml(cluster.name)}</div>
                    <div class="motif-row-count">${countLabel}</div>
                </div>
                <div class="motif-panel" data-cluster="${encodedCluster}">
                    <div class="motif-panel-actions">
                        <div class="note">${countLabel} items</div>
                        <button class="motif-view-all" data-cluster="${encodedCluster}" onclick="viewMotifAllFromPanel(event)">View all</button>
                    </div>
                    <div class="motif-preview"></div>
                </div>
            `;
        }

        function ensureMotifPanelState(clusterName) {
            const key = (clusterName || '').toLowerCase();
            if (!motifPanelState[key]) {
                motifPanelState[key] = { limit: MOTIF_PANEL_PAGE_SIZE };
            }
        }

        function toggleMotifPanel(event) {
            event.preventDefault();
            const datasetValue = event.currentTarget.dataset.cluster;
            if (!datasetValue) return;
            const clusterName = decodeURIComponent(datasetValue);
            
            // Open in drawer instead of inline panel
            openMotifDrawer(clusterName);
        }
        
        function openMotifDrawer(clusterName) {
            const drawer = document.getElementById('gensDrawer');
            const backdrop = document.getElementById('drawerBackdrop');
            if (!drawer || !backdrop) return;
            
            const items = getClusterItems(clusterName);
            if (!items.length) {
                alert('No items mapped to this cluster yet.');
                return;
            }
            
            backdrop.classList.add('show');
            drawer.classList.add('show');
            
            const limit = Math.min(20, items.length);
            const page = items.slice(0, limit);
            
            let html = '<div class="gens-drawer-inner">';
            html += '<div class="gens-drawer-header">';
            html += '<span style="font-weight: 700; color: #1f1b16; font-size: 1.1rem;">' + escapeHtml(clusterName) + '</span>';
            html += '<span style="color: #6f675c; font-size: 0.9rem;">' + items.length.toLocaleString() + ' items</span>';
            html += '</div>';
            
            page.forEach(function(item) {
                const polished = escapeHtml(formatTitle(item.polished || item.text || '', item.metadata || {}));
                const raw = escapeHtml(item.raw || '');
                const payload = encodeURIComponent(item.polished || item.text || '');
                const classificationChips = getClassificationChips(item.metadata || {});
                html += '<div class="result-item">';
                html += '<button type="button" class="phrase-pill" data-clickable data-text="' + payload + '">' + polished + '</button>';
                html += classificationChips;
                if (raw) html += '<div class="result-raw">Raw: ' + raw + '</div>';
                html += '</div>';
            });
            
            if (limit < items.length) {
                html += '<button class="load-more-btn" onclick="viewCluster(\'' + escapeHtml(clusterName).replace(/'/g, "\\'") + '\'); closeGensDrawer();">View all ' + items.length.toLocaleString() + ' items</button>';
            }
            
            html += '</div>';
            drawer.innerHTML = html;
            
            showDrawerControls();
            setTimeout(function() {
                attachDrawerScrollHandlers();
                if (window.SharedInteractions && typeof window.SharedInteractions.autoApplyClickable === 'function') {
                    window.SharedInteractions.autoApplyClickable();
                }
            }, 60);
        }

        function viewMotifAllFromPanel(event) {
            event.preventDefault();
            event.stopPropagation();
            const datasetValue = event.currentTarget.dataset.cluster;
            if (!datasetValue) return;
            const clusterName = decodeURIComponent(datasetValue);
            viewCluster(clusterName);
        }

        function renderMotifPanelPreview(clusterName) {
            const datasetValue = encodeURIComponent(clusterName || '');
            const panel = Array.from(document.querySelectorAll('.motif-panel')).find(p => p.dataset.cluster === datasetValue);
            const container = panel ? panel.querySelector('.motif-preview') : null;
            if (!container) return;

            const items = getClusterItems(clusterName);
            const state = motifPanelState[(clusterName || '').toLowerCase()] || { limit: MOTIF_PANEL_PAGE_SIZE };
            const limit = Math.min(state.limit, items.length);
            const page = items.slice(0, limit);

            let html = page.map(item => {
                const polished = escapeHtml(formatTitle(item.polished || item.text || '', item.metadata || {}));
                const raw = escapeHtml(item.raw || '');
                const payload = encodeURIComponent(item.polished || item.text || '');
                const classificationChips = getClassificationChips(item.metadata || {});
                return `
                    <div class="result-item">
                        <button type="button" class="phrase-pill" data-clickable data-text="${payload}">${polished}</button>
                        ${classificationChips}
                        ${raw ? `<div class="result-raw">Raw: ${raw}</div>` : ''}
                    </div>
                `;
            }).join('');

            if (limit < items.length) {
                html += `<button class="motif-more" data-cluster="${datasetValue}" onclick="expandMotifPanel(event)">View more</button>`;
            }
            container.innerHTML = html;
            if (window.SharedInteractions && typeof window.SharedInteractions.autoApplyClickable === 'function') {
                window.SharedInteractions.autoApplyClickable();
            }
        }

        function expandMotifPanel(event) {
            event.preventDefault();
            event.stopPropagation();
            const datasetValue = event.currentTarget.dataset.cluster;
            if (!datasetValue) return;
            const clusterName = decodeURIComponent(datasetValue);
            ensureMotifPanelState(clusterName);
            motifPanelState[(clusterName || '').toLowerCase()].limit += MOTIF_PANEL_PAGE_SIZE;
            renderMotifPanelPreview(clusterName);
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function handleClusterHashNavigation() {
            if (pendingClusterActivation) {
                pendingClusterActivation = false;
                switchTab('cluster');
            }
        }

        window.addEventListener('hashchange', () => {
            if (window.location.hash === CLUSTER_HASH) {
                if (currentContext?.type !== 'cluster') {
                    switchTab('cluster');
                }
            } else if (currentContext?.type === 'cluster') {
                switchTab('text');
            }
        });

        // Load data on page load
        console.log('[DEBUG] readyState:', document.readyState, 'MetaphorGymCache:', typeof window.MetaphorGymCache);
        if (document.readyState === 'loading') {
            console.log('[DEBUG] Waiting for DOMContentLoaded');
            document.addEventListener('DOMContentLoaded', () => {
                console.log('[DEBUG] DOMContentLoaded fired, MetaphorGymCache:', typeof window.MetaphorGymCache);
                loadData();
            });
        } else {
            console.log('[DEBUG] DOM already loaded, calling loadData immediately');
            loadData();
        }
    </script>
</body>
</html>
