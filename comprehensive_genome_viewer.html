        // CRITICAL: Emergency Cleanup for QuotaExceededError
        // This runs immediately to kill any rogue Service Workers
        (async function() {
            console.log('Starting emergency cleanup...');
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for(let registration of registrations) {
                        console.log('Force unregistering SW:', registration);
                        await registration.unregister();
                    }
                }
                if ('caches' in window) {
                    const keys = await caches.keys();
                    for(const key of keys) {
                        console.log('Deleting cache:', key);
                        await caches.delete(key);
                    }
                }
                console.log('Cleanup complete.');
            } catch(e) {
                console.error('Cleanup failed:', e);
            }
        })();

    <header>

                .replace(/[^\w\-]+/g, '')       // Remove all non-word chars
                .replace(/\-\-+/g, '-')         // Replace multiple - with single -
                .replace(/^-+/, '')             // Trim - from start
                .replace(/-+$/, '');            // Trim - from end
        }

        async function loadAllShards() {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            
            try {
                // Load manifest to know which shards exist
                const manifestResp = await fetch(`${R2_BASE_URL}/manifest.json?t=${Date.now()}`);
                if (!manifestResp.ok) throw new Error('Failed to load manifest');
                const manifest = await manifestResp.json();
                
                // FALLBACK: If shard_list is missing (v3 manifest), generate it from count
                if (!manifest.shard_list && manifest.shards_count) {
                    console.log('Generating shard list from count:', manifest.shards_count);
                    manifest.shard_list = [];
                    for (let i = 0; i < manifest.shards_count; i++) {
                        const hex = i.toString(16).toLowerCase().padStart(2, '0');
                        manifest.shard_list.push(`${hex}.json.gz`);
                    }
                }
                
                console.log(`Loading ${manifest.shard_list ? manifest.shard_list.length : 0} shards with ${manifest.total_songs} total songs...`);

                // Load all shards in parallel (with batching to avoid overwhelming)
                if (!manifest.shard_list) throw new Error('No shard list found in manifest');
                
                const shardIds = manifest.shard_list.map(name => name.replace('.json.gz', ''));
                const batchSize = 32;
                let loadedShards = 0;
                let failedShards = 0;
                
                for (let i = 0; i < shardIds.length; i += batchSize) {
                    const batch = shardIds.slice(i, i + batchSize);
                    console.log(`Loading batch ${Math.floor(i/batchSize) + 1}/${Math.ceil(shardIds.length/batchSize)}: shards ${i}-${i+batch.length-1}`);
                    
                    const promises = batch.map(async (shardId) => {
                        try {
                            const data = await loadShard(shardId);
                            if (data && data.length > 0) {
                                loadedShards++;
                                return data;
                            }
                            failedShards++;
                            return [];
                        } catch (e) {
                            console.error(`Failed to load shard ${shardId}:`, e);
                            failedShards++;
                            return [];
                        }
                    });
                    
                    const results = await Promise.all(promises);
                    results.forEach(songs => {
                        if (songs && songs.length > 0) {
                            window.allSongs.push(...songs);
                        }
                    });
                    
                    document.getElementById('resultsCount').textContent = 
                        `Loaded ${window.allSongs.length.toLocaleString()} / ${manifest.total_songs.toLocaleString()} songs (${loadedShards} shards, ${failedShards} failed)...`;
                }
                
                console.log(`Finished loading: ${window.allSongs.length} songs from ${loadedShards} shards (${failedShards} failed)`);
                
                // DEBUG: Check first 5 songs for new fields
                if (window.allSongs.length > 0) {
                    console.log("--- DEBUG: INSPECTING SONGS ---");
                    window.allSongs.slice(0, 5).forEach((s, i) => {
                        console.log(`Song ${i}:`, s.title, "| Genre:", s.primary_genre, "| Decade:", s.decade);
                    });
                    console.log("-------------------------------");
                }

                // window.filteredSongs = window.allSongs; // REMOVED FALLBACK to ensure filtering logic runs
                // filteredSongs = window.filteredSongs;
                document.getElementById('resultsCount').textContent = 
                    `${window.allSongs.length.toLocaleString()} songs loaded. Filtering...`;
                    
            } catch (e) {
                console.error('Error loading shards:', e);
                document.getElementById('resultsCount').textContent = 'Error loading songs';
            } finally {
                loading.classList.add('hidden');
            }
        }
        
        async function loadShard(shardId) {
            try {
                const resp = await fetch(`${R2_BASE_URL}/${shardId}.json.gz?t=${Date.now()}`);
                if (!resp.ok) {
                    console.warn(`Shard ${shardId} returned ${resp.status}`);
                    return [];
                }
                
                // Decompress gzip response
                const blob = await resp.blob();
                const ds = new DecompressionStream('gzip');
                const decompressedStream = blob.stream().pipeThrough(ds);
                const decompressedBlob = await new Response(decompressedStream).blob();
                const text = await decompressedBlob.text();
                
                // V2 shards are JSON arrays, not JSONL
                const parsed = JSON.parse(text);
                console.log(`Loaded shard ${shardId}: ${parsed.length} songs`);
                return parsed;
            } catch (e) {
                console.error(`Error loading shard ${shardId}:`, e);
                return [];
            }
        }

            const decadeCounts = {};

            baseMatches.forEach(song => {
                 if (song.decade && DECADES_ENUMS.includes(song.decade)) {
                    decadeCounts[song.decade]++;
                }
            });
            
            // 2. Genre Counts: Derived from Decade Matches (Search + Status + Selected Decade)
            // This shows "How many results in each genre *within this decade*?"
            const catCounts = {};

                `;
                fragment.appendChild(chip);
            });
            
            container.appendChild(fragment);

            // Load More Button
            if (artists.length > currentArtistLimit) {
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.className = 'load-more-btn';
                loadMoreBtn.textContent = `Load More Artists (${(artists.length - currentArtistLimit).toLocaleString()} remaining)`;
                loadMoreBtn.onclick = () => {
                    currentArtistLimit += ARTIST_ITEMS_PER_PAGE;
                    renderArtistList();
                };
                container.appendChild(loadMoreBtn);
            }
            
            // Update counts
            document.getElementById('resultsCount').textContent = 
                `${artists.length.toLocaleString()} artists`;
        }
        
        function renderSongList() {
            const container = document.getElementById('songList');
            container.className = 'song-list'; // Reset to grid view
            const songsToShow = window.filteredSongs.slice(virtualScrollOffset, virtualScrollOffset + ITEMS_PER_PAGE);
            
            // Clear and render
            container.innerHTML = '';
            
            // Add "Back to Artists" header if an artist is selected
            if (window.activeFilters.artist) {
                const header = document.createElement('div');
                header.style.padding = '0 0 16px 0';
                header.style.gridColumn = '1 / -1';
                header.innerHTML = `
                    <button class="back-button" onclick="setFilter('artist', null)">← Back to All Artists</button>
                    <div style="font-size: 20px; font-weight: 700; color: #1c1c1e; margin-top: 8px;">
                        ${window.escapeHtml(window.activeFilters.artist)}
                    </div>
                `;
                container.appendChild(header);

                // Inject Artist Profile
                const profileSong = window.filteredSongs.find(s => s.artist_bio || (s.artist_tags && s.artist_tags.length > 0) || (s.artist_associated_acts && s.artist_associated_acts.length > 0)) || window.filteredSongs[0];
                
                if (profileSong) {
                    const profileHTML = renderArtistProfile(profileSong);
                    if (profileHTML) {
                        const profileDiv = document.createElement('div');
                        profileDiv.style.gridColumn = '1 / -1';
                        profileDiv.style.marginBottom = '20px';
                        profileDiv.innerHTML = profileHTML;
                        container.appendChild(profileDiv);
                    }
                }
            }

            const fragment = document.createDocumentFragment();
            
            songsToShow.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.onclick = () => showSongDetail(song);
                
                const badges = [];
                if (song.eli5_genome) badges.push('<span class="meta-badge genome">Genome</span>');
                if (song.pattison) badges.push('<span class="meta-badge pattison">Rhyme</span>');
                
                card.innerHTML = `
                    <div class="song-title">${window.escapeHtml(song.title || 'Unknown')}</div>
                    <div class="song-artist">${window.escapeHtml(song.artist || 'Unknown Artist')}</div>
                    <div class="song-meta">${badges.join('')}</div>
                `;
                
                fragment.appendChild(card);
            });
            
            container.appendChild(fragment);
            
            const totalPages = Math.ceil(window.filteredSongs.length / ITEMS_PER_PAGE);
            const currentPage = Math.floor(virtualScrollOffset / ITEMS_PER_PAGE) + 1;
            
            document.getElementById('resultsCount').textContent = 
                `${window.filteredSongs.length.toLocaleString()} songs (page ${currentPage}/${totalPages})`;
        }
        
        function renderArtistProfile(song) {
            if (!song.artist_bio && (!song.artist_associated_acts || song.artist_associated_acts.length === 0) && (!song.artist_tags || song.artist_tags.length === 0)) {
                return '';
            }

            const associatedActs = song.artist_associated_acts || [];
            const tags = song.artist_tags || [];
            const styles = song.artist_styles || [];
            const allTags = [...new Set([...tags, ...styles])];

            const actsHTML = associatedActs.length > 0 ? `
                <div class="artist-meta-group">
                    <div class="artist-meta-label">Associated Acts</div>
                    <div class="chip-container">
                        ${associatedActs.map(act => `<span class="meta-chip act">${escapeHtml(act)}</span>`).join('')}
                    </div>
                </div>
            ` : '';

            const tagsHTML = allTags.length > 0 ? `
                <div class="artist-meta-group">
                    <div class="artist-meta-label">Genres & Styles</div>
                    <div class="chip-container">
                        ${allTags.map(tag => `<span class="meta-chip tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                </div>
            ` : '';
            
            const bioHTML = song.artist_bio ? `
                <div class="artist-bio-text">${escapeHtml(song.artist_bio)}</div>
            ` : '';

            return `
                <div class="artist-section">
                    <div class="section-header">
                        <div class="section-name" style="color: #8b5cf6;">Artist Profile</div>
                    </div>
                    ${bioHTML}
                    ${actsHTML}
                    ${tagsHTML}
                </div>
            `;
        }
        
        function renderELI5() {
            if (!currentSong || !currentSong.eli5_genome) return;
            
            const eli5 = currentSong.eli5_genome;
            const plot = eli5.line_by_line_plot || [];
            
            if (plot.length === 0) return;
            
            const container = document.getElementById('eli5Container');
            
            const plotHTML = plot.map(item => {
                const lineNums = item.line_numbers || [];
                const lyric = item.original_lyric || '';
                const explanation = item.eli5_simplification || item.explanation || '';
                const plotFunc = item.plot_function || '';
                const emotion = item.emotion_primary || '';
                
                const tagsHTML = [];
                if (plotFunc) tagsHTML.push(`<span class="genome-tag tag-plot">${escapeHtml(plotFunc)}</span>`);
                if (emotion) tagsHTML.push(`<span class="genome-tag tag-emotion">${escapeHtml(emotion)}</span>`);
                
                return `
                    <div class="eli5-plot-item">
                        <div class="eli5-line-number">Lines ${lineNums.join(', ')}</div>
                        <div class="eli5-lyric">"${escapeHtml(lyric)}"</div>
                        <div class="eli5-explanation"><span class="eli5-label">ELI5:</span>${escapeHtml(explanation)}</div>
                        ${tagsHTML.length ? `<div class="eli5-metadata">${tagsHTML.join('')}</div>` : ''}
                    </div>
                `;
            }).join('');
            
            container.innerHTML = `
                <div class="eli5-section">
                    <div class="eli5-header">
                        <span>🧬</span>
                        <span>Genome Analysis</span>
                    </div>
                    ${plotHTML}
                </div>
            `;
        }
        
        function renderSections() {
            if (!currentSong || !currentSong.pattison) return;
            
            const pattison = currentSong.pattison;
            const stanzas = pattison.stanzas || [];
            const lines = pattison.lines || [];
            const rhymePairs = pattison.rhyme_pairs || [];
            const internalRhymes = pattison.internal_rhymes || [];
            const rawScheme = (pattison.raw_rhyme_scheme || '').split('');
            
            // Create global rhyme color map
            const globalRhymeColorMap = new Map();
            let globalColorIndex = 0;
            
            internalRhymes.forEach(rhyme => {
                const key = [rhyme.word1, rhyme.word2].sort().join('|');
                if (!globalRhymeColorMap.has(key)) {
                    globalRhymeColorMap.set(key, globalColorIndex % 10);
                    globalColorIndex++;
                }
            });
            
            const container = document.getElementById('sectionsContainer');
            
            // If no stanzas, treat as single section
            if (stanzas.length === 0 && lines.length > 0) {
                container.innerHTML = renderSection({
                    name: 'Full Song',
                    lines: lines,
                    rawScheme: rawScheme,
                    rhymePairs: rhymePairs,
                    internalRhymes: internalRhymes,
                    globalRhymeColorMap: globalRhymeColorMap
                });
                return;
            }
            
            // Render each stanza as a section
            let lineOffset = 0;
            container.innerHTML = stanzas.map((stanza, idx) => {
                const stanzaLines = lines.slice(lineOffset, lineOffset + stanza.length);
                const stanzaScheme = rawScheme.slice(lineOffset, lineOffset + stanza.length);
                
                // Filter rhymes for this section
                const sectionRhymes = rhymePairs.filter(r => 
                    r.line1 > lineOffset && r.line1 <= lineOffset + stanza.length
                );
                const sectionInternalRhymes = internalRhymes.filter(r => 
                    (r.line1 && r.line1 > lineOffset && r.line1 <= lineOffset + stanza.length) ||
                    (r.line && r.line > lineOffset && r.line <= lineOffset + stanza.length)
                );
                
                lineOffset += stanza.length;
                
                return renderSection({
                    name: `Section ${idx + 1}`,
                    lines: stanzaLines,
                    rawScheme: stanzaScheme,
                    rhymePairs: sectionRhymes,
                    internalRhymes: sectionInternalRhymes,
                    globalRhymeColorMap: globalRhymeColorMap,
                    lineOffset: lineOffset - stanza.length
                });
            }).join('');
        }
        
        function renderSection({ name, lines, rawScheme, rhymePairs, internalRhymes, globalRhymeColorMap, lineOffset = 0 }) {
            // FILTER: Remove self-rhymes and trivial words (the, a, and, etc.)
            const STOP_WORDS = new Set([
                'the', 'a', 'an', 'and', 'or', 'but', 'if', 'of', 'in', 'on', 'to', 'for', 'is', 'it', 'that', 'this', 
                'at', 'by', 'from', 'into', 'onto', 'with', 'as', 'nor', 'am', 'are', 'was', 'were', 'be', 'been', 'being',
                'i', 'me', 'my', 'mine', 'you', 'your', 'yours', 'he', 'him', 'his', 'she', 'her', 'hers', 
                'we', 'us', 'our', 'ours', 'they', 'them', 'their', 'theirs', 'its', 'oh', 'ah', 'yeah', 'so', 'just', 'now', 'then',
                'can', 'do', 'did', 'does', 'don', 't', 's', 'll', 'm', 're', 've', 'd'
            ]);
            
            const filterRhyme = (r) => {
                const w1 = (r.word1 || '').toLowerCase().trim();
                const w2 = (r.word2 || '').toLowerCase().trim();
                
                // 1. No self-rhymes
                if (w1 === w2) return false;
                
                // 2. No stop words (if EITHER word is a stop word, filter the pair)
                if (STOP_WORDS.has(w1) || STOP_WORDS.has(w2)) return false;
                
                return true;
            };

            const filteredRhymePairs = rhymePairs.filter(filterRhyme);
            const filteredInternalRhymes = internalRhymes.filter(filterRhyme);

            const lyricsHTML = lines.map((line, i) => {
                let text = line.text || '';
                const schemeChar = rawScheme[i] || '';
                
                // Highlight end word
                const endWord = line.end_word;
                if (endWord) {
                    const regex = new RegExp(`\\b${escapeRegex(endWord)}\\b`, 'gi');
                    text = text.replace(regex, `<span class="end-word">${endWord}</span>`);
                }
                
                // Highlight internal rhymes - PREVENT STACKING
                // 1. Collect all unique words to highlight for this line and their colors
                const wordsToHighlight = new Map(); // word -> colorIdx
                
                const lineInternalRhymes = filteredInternalRhymes.filter(ir => 
                    ir.line1 === i + 1 + lineOffset || ir.line2 === i + 1 + lineOffset || ir.line === i + 1 + lineOffset
                );
                
                lineInternalRhymes.forEach(rhyme => {
                    const words = [rhyme.word1, rhyme.word2];
                    const key = words.sort().join('|');
                    const colorIdx = globalRhymeColorMap.get(key) || 0;
                    
                    words.forEach(word => {
                        const w = word.toLowerCase();
                        if (!STOP_WORDS.has(w)) {
                            // Only set if not present to avoid stacking/overwriting
                            // (First rhyme found dictates the color)
                            if (!wordsToHighlight.has(w)) {
                                wordsToHighlight.set(w, colorIdx);
                            }
                        }
                    });
                });
                
                // 2. Apply highlights in one pass (conceptually)
                // We iterate the map, which contains unique words.
                wordsToHighlight.forEach((colorIdx, word) => {
                    // Use a lookahead/lookbehind or careful replacement to ensure we don't break HTML tags?
                    // Since we are replacing text with <span>text</span>, subsequent replacements of DIFFERENT words are safe.
                    // We just need to be careful not to match inside existing tags.
                    // But since we operate on 'word' boundaries, and our previous replacements added tags...
                    // A simple regex might match the word inside the class name? e.g. class="... word ..."
                    // To be safe, we can try to only replace if not inside a tag.
                    
                    // Simple hack: We trust that words don't collide with our class names (internal-rhyme-X).
                    // Our class names are 'internal-rhyme-X', 'end-word'.
                    // If a word is 'internal', it might match. 
                    // Let's assume lyrics don't contain markup words.
                    
                    const regex = new RegExp(`\\b${escapeRegex(word)}\\b`, 'gi');
                    
                    // To avoid matching inside tags, we can use a callback, but JS regex lookbehind is limited in some browsers.
                    // Instead, we can rely on the fact that we are building the string.
                    // Actually, if we replaced 'honey' with '<span...>honey</span>', 
                    // and then try to replace 'honey' again, we will match the inner text AND potentially attributes.
                    // BUT: We de-duplicated! 'wordsToHighlight' has 'honey' ONLY ONCE.
                    // So we will only call replace ONCE for 'honey'.
                    
                    text = text.replace(regex, (match) => {
                        // Check if we are inside a tag? Hard to tell.
                        // But since we unique-ified the words, we won't try to replace 'honey' twice.
                        // The only risk is if Word A is a substring of Word B?
                        // \b guards against substrings.
                        // Risk: If Word A is 'span'?
                        return `<span class="internal-rhyme internal-rhyme-${colorIdx}">${match}</span>`;
                    });
                });
                
                return `
                    <div class="lyric-line">
                        <span class="line-text">${text}</span>
                        <span class="line-stress" title="Stressed Syllables">${line.primary_stress_count || 0}</span>
                        <span class="line-scheme" title="Rhyme Scheme">${schemeChar || '-'}</span>
                    </div>
                `;
            }).join('');
            
            const allRhymes = [];
            filteredRhymePairs.forEach(pair => {
                allRhymes.push({
                    word1: pair.word1,
                    word2: pair.word2,
                    type: pair.pattison_type || 'perfect',
                    category: 'End-Word Rhyme'
                });
            });
            filteredInternalRhymes.forEach(rhyme => {
                allRhymes.push({
                    word1: rhyme.word1,
                    word2: rhyme.word2,
                    type: rhyme.pattison_type || 'perfect',
                    category: 'Internal Rhyme'
                });
            });
            
            const rhymesHTML = allRhymes.length > 0 ? `
                <div class="rhyme-pairs-section">
                    <div class="rhyme-pairs-header" onclick="toggleRhymes(this)">
                        <div class="rhyme-pairs-title">Rhymes (${allRhymes.length})</div>
                        <div class="rhyme-toggle-icon">▼</div>
                    </div>
                    <div class="rhyme-pairs-content" style="display: none;">
                        ${allRhymes.map(rhyme => `
                            <div class="rhyme-pair">
                                <div>
                                    <span class="rhyme-words">${rhyme.word1 || ''}</span> / 
                                    <span class="rhyme-words">${rhyme.word2 || ''}</span>
                                    <span class="rhyme-badge rhyme-${rhyme.type.toLowerCase()}">${rhyme.type}</span>
                                </div>
                                <span style="font-size: 12px; color: #8e8e93;">${rhyme.category}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '';
            
            const schemeStr = rawScheme.join('');
            const displayScheme = schemeStr.length > 20 ? schemeStr.substring(0, 20) + '...' : schemeStr;
            
            return `
                <div class="section-container">
                    <div class="section-header">
                        <div class="section-name">${name}</div>
                        <div class="section-scheme" title="${schemeStr}">${displayScheme || 'N/A'}</div>
                    </div>
                    <div class="lyrics-container">
                        ${lyricsHTML}
                    </div>
                    ${rhymesHTML}
                </div>
            `;
        }
        
        // Legacy function references (now use window.* versions)
        function hideSongDetail() { window.hideSongDetail(); }
        function escapeHtml(text) { return window.escapeHtml(text); }
        function escapeRegex(str) { return window.escapeRegex(str); }
        function toggleRhymes(headerElement) { window.toggleRhymes(headerElement); }
        
        function toggleELI5Repeats(element) {
            const repeatsDiv = element.nextElementSibling;
            if (repeatsDiv && repeatsDiv.classList.contains('eli5-repeats')) {
                if (repeatsDiv.style.display === 'none') {
                    repeatsDiv.style.display = 'block';
                    element.textContent = '▼ Hide repeats';
                } else {
                    repeatsDiv.style.display = 'none';
                    element.textContent = '▶ See repeats (' + repeatsDiv.children.length + ')';
                }
            }
        }
        
        init();
    </script>
</body>
</html>
